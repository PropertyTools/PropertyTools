name: Bug Report
description: Report a bug or unexpected behavior in PropertyTools
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us diagnose and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
      placeholder: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: control
    attributes:
      label: Affected Control
      description: Which PropertyTools control is affected by this bug?
      options:
        - PropertyGrid
        - DataGrid
        - TreeListBox
        - ColorPicker
        - RadioButtonList
        - EnumMenuItem
        - EditableTextBlock
        - FilePicker
        - DirectoryPicker
        - DockPanelSplitter
        - SpinControl
        - LinkBlock
        - SliderEx
        - TextBlockEx
        - PopupBox
        - FormattingTextBox
        - Other/Multiple
        - Not sure
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Videos
      description: If applicable, add screenshots or videos to help explain the problem.
      placeholder: Drag and drop screenshots here...

  - type: textarea
    id: code-sample
    attributes:
      label: Code Sample
      description: If applicable, provide a minimal code sample that reproduces the issue.
      render: csharp
      placeholder: |
        // Your code here
        var grid = new DataGrid();
        // ...

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Any other information that might be helpful...

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our contribution guidelines.
      options:
        - label: I have checked the [documentation](https://github.com/PropertyTools/PropertyTools) and existing issues
          required: true
        - label: I have provided all the information needed to reproduce the issue
          required: true
